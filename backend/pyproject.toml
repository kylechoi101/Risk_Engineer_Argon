[project]
name = "argon-backend"
version = "0.1.0"
description = "Argon-Risk simulation API: streams natech cascade analysis over SSE."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "numpy>=2.0",
    "google-genai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.fastapi]
entrypoint = "argon.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning:google.genai.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["argon"]
